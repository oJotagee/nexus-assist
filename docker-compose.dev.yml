services:
  # ── PostgreSQL ─────────────────────────────────────────────
  # Um banco por serviço: assist (conversas, agent) e tickets (sistema legado simulado).
  postgres:
    image: postgres:18.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
      # variável CUSTOMIZADA, lida pelo init-databases.sh:
      POSTGRES_EXTRA_DATABASES: nexo_assist, nexo_tickets
    volumes:
      # Postgres 18+: monte em /var/lib/postgresql (SEM /data no fim).
      - postgres_data:/var/lib/postgresql
      # scripts em /docker-entrypoint-initdb.d/ rodam UMA vez, na criação do volume:
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
