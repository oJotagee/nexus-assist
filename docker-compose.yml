# Ambiente completo: docker compose up --build
# (assist e frontend entram aqui nos próximos marcos)
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
      POSTGRES_EXTRA_DATABASES: nexo_assist, nexo_tickets
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sistema de chamados (legado simulado). Sem porta publicada: só a rede interna
  # do compose fala com ele, como no PRD.
  tickets:
    build:
      context: .
      dockerfile: services/tickets/Dockerfile
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/nexo_tickets
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-dev-internal-secret-0123456789}
      TICKETS_FAILURE_RATE: ${TICKETS_FAILURE_RATE:-0.15}
      TICKETS_MAX_LATENCY_MS: ${TICKETS_MAX_LATENCY_MS:-400}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:8082/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
